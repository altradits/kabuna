  <text x="66" y="49" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="2.8" fill="#B45309">ETHIOPIAN SPECIALTY COFFEE • ካቡና</text>
